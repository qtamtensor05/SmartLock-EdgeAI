model:
  path: models/mobilefacenet_scripted.pt
  name: MobileFaceNet
  version: fp32-v1
  artifact_id: mobilefacenet-fp32-v1
  checkpoint_sha256: 780e31e7c2639a0d5fdebe843f5df3ff81fda79a090164df0ff40514d172853a
  embedding_dim: 128
  device: cpu
detector:
  model_path: models/face_detection_yunet_2023mar.onnx
  confidence_threshold: 0.80
  nms_threshold: 0.30
  top_k: 5000
input:
  color_space: RGB
  width: 112
  height: 112
  tensor_layout: NCHW
  dtype: float32
  pixel_range: [0, 255]
  interpolation: linear
  normalization:
    mode: current
    version: preprocess-rgb-mean05-v1
    verified_against_training: false
    modes:
      current:
        formula: "(pixel / 255.0 - 0.5) / 0.5"
        scale: 0.00392156862745098
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
        version: preprocess-rgb-mean05-v1
      imagenet:
        formula: "(pixel / 255.0 - mean) / std"
        scale: 0.00392156862745098
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
        version: preprocess-rgb-imagenet-v1
      arcface128:
        formula: "(pixel - 127.5) / 128.0"
        scale: 1.0
        mean: [127.5, 127.5, 127.5]
        std: [128.0, 128.0, 128.0]
        version: preprocess-rgb-arcface128-v1
alignment:
  template: arcface_112x112
  landmarks:
    - [38.2946, 51.6963]
    - [73.5318, 51.5014]
    - [56.0252, 71.7366]
    - [41.5493, 92.3655]
    - [70.7299, 92.2041]
matching:
  cosine_threshold: 0.65
  threshold_calibrated: false
quality:
  low_light_mean_luma: 35.0
storage:
  path: data/faces.json
  max_samples_per_person: 20
transport:
  max_jpeg_bytes: 1048576
  max_decoded_pixels: 1000000
  request_timeout_seconds: 10.0
