<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartLock · Camera AI</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef3f1; color: #132a25; font: 16px system-ui, sans-serif; }
  main { width: min(720px, 100% - 32px); margin: 42px auto; }
  h1 { font-size: clamp(26px, 5vw, 40px); margin: 0 0 20px; }
  figure { margin: 0 0 18px; background: #172724; border-radius: 16px; overflow: hidden; }
  img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block; color: white; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #8eaaa2; }
  input { width: 76px; }
  button { cursor: pointer; background: #fff; color: inherit; }
  button[type=submit] { background: #075947; color: white; border-color: #075947; }
  button:disabled { opacity: .55; cursor: wait; }
  output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 16px; }
  small { display: block; margin-top: 14px; }
</style>
<main>
  <h1>Camera SmartLock</h1>
  <figure><img id="preview" alt="Đang lấy ảnh xem trước từ ESP32"></figure>
  <form class="controls" id="enroll">
    <label for="person">ID người</label>
    <input id="person" type="number" min="1" max="32" step="1" value="1" required>
    <button type="submit">Chụp và đăng ký</button>
    <button type="button" id="identify">Nhận diện</button>
  </form>
  <small>Giữ mặt trong khung khi bấm nút. ESP32 lấy một ảnh cho lệnh đăng ký hoặc nhận diện.</small>
  <output id="status" role="status"></output>
  <section id="diagnostic" hidden>
    <h2>Ảnh ESP32 dùng để đăng ký</h2>
    <figure><img id="enrollment" alt="Khung hình đã được detector xử lý"></figure>
  </section>
</main>
<script>
  const preview = document.querySelector('#preview');
  const status = document.querySelector('#status');
  const buttons = document.querySelectorAll('button');
  let busy = false;
  let loading = false;
  let previousUrl;

  async function updatePreview() {
    if (busy || loading || document.hidden) return;
    loading = true;
    try {
      const response = await fetch('/frame.jpg');
      if (!response.ok) throw new Error((await response.json()).message || 'Camera chưa sẵn sàng.');
      const url = URL.createObjectURL(await response.blob());
      preview.src = url;
      if (previousUrl) URL.revokeObjectURL(previousUrl);
      previousUrl = url;
      if (status.dataset.kind === 'preview') status.textContent = '';
    } catch (error) {
      status.dataset.kind = 'preview';
      status.textContent = error.message;
    } finally {
      loading = false;
    }
  }

  async function action(path, data) {
    busy = true;
    buttons.forEach(button => button.disabled = true);
    status.dataset.kind = 'action';
    status.textContent = 'Đang xử lý trên ESP32…';
    try {
      const response = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
      const result = await response.json();
      status.textContent = result.message || 'ESP32 không trả kết quả.';
      if (path === '/enroll') {
        document.querySelector('#diagnostic').hidden = !result.has_frame;
        if (result.has_frame) document.querySelector('#enrollment').src = '/enrollment.jpg?' + Date.now();
      }
    } catch (error) {
      status.textContent = error.message;
    } finally {
      busy = false;
      buttons.forEach(button => button.disabled = false);
    }
  }

  document.querySelector('#enroll').addEventListener('submit', event => {
    event.preventDefault();
    action('/enroll', {id: document.querySelector('#person').valueAsNumber});
  });
  document.querySelector('#identify').addEventListener('click', () => action('/identify', {}));
  updatePreview();
  setInterval(updatePreview, 200);
</script>
</html>
